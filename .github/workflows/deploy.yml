# Публикация на GitHub Pages.
# Настройки репозитория: Settings → Pages → Source: GitHub Actions.
# Переменные (Settings → Secrets and variables → Actions → Variables), все необязательны:
#   CUSTOM_DOMAIN — свой домен, например minsteel.info (тогда сайт собирается от корня и кладётся CNAME)
#   PUBLIC_YM_ID  — номер счётчика Яндекс.Метрики
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - name: Build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          PUBLIC_YM_ID: ${{ vars.PUBLIC_YM_ID }}
          SITE_URL: ${{ vars.CUSTOM_DOMAIN && format('https://{0}', vars.CUSTOM_DOMAIN) || steps.pages.outputs.origin }}
          BASE_PATH: ${{ vars.CUSTOM_DOMAIN && '/' || steps.pages.outputs.base_path || '/' }}
        run: npm run build
      - name: CNAME для своего домена
        if: ${{ vars.CUSTOM_DOMAIN != '' }}
        run: echo "${{ vars.CUSTOM_DOMAIN }}" > dist/CNAME
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
